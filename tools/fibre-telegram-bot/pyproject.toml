[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fibre-telegram-bot"
version = "0.3.6"
description = "Telegram bot for the Celestia Fibre Network Monitor API by Cumulo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.7",
  "apscheduler>=3.10,<4",
  "resvg-py>=0.5",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
fibre-bot = "fibre_bot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fibre_bot.assets" = ["*.ttf", "*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real Fibre API (opt-in with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fibre_bot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "resvg_py.*", "apscheduler.*"]
ignore_missing_imports = true
