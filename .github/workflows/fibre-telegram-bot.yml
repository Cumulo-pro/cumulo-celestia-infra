name: fibre-telegram-bot
on:
  push:
    paths: ["tools/fibre-telegram-bot/**", ".github/workflows/fibre-telegram-bot.yml"]
  pull_request:
    paths: ["tools/fibre-telegram-bot/**", ".github/workflows/fibre-telegram-bot.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fibre-telegram-bot
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest
